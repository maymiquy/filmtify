version: '3.8'

services:
  db-filmtify:
    image: postgres:16.1
    container_name: db-filmtify
    ports:
      - 15432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=filmtify-membership
    volumes:
      - data_postgres:/var/lib/postgresql/data

volumes:
  data_postgres:
